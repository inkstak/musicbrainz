require:
  - rubocop-performance
  - rubocop-rspec
  - standard

inherit_gem:
  standard:
    - config/base.yml
    - config/ruby-2.5.yml
    - config/ruby-2.7.yml

AllCops:
  TargetRubyVersion: 3.3

Layout/ExtraSpacing:
  Enabled:                     true
  AllowForAlignment:           true
  AllowBeforeTrailingComments: false
  ForceEqualSignAlignment:     false

Layout/HashAlignment:
  EnforcedHashRocketStyle: table
  EnforcedColonStyle:      table

Layout/LineLength:
  Exclude:
    - spec/**/*_spec.rb

Layout/SpaceBeforeBlockBraces:
  Exclude:
    - spec/**/*_spec.rb

Layout/SpaceInsideHashLiteralBraces:
  EnforcedStyle: space

Layout/SpaceInsideParens:
  Exclude:
    - spec/**/*_spec.rb

Metrics/AbcSize:
  Enabled: false

Metrics/MethodLength:
  Enabled: false

Metrics/BlockLength:
  Exclude:
    - spec/**/*_spec.rb

RSpec/ContextWording:
  Enabled: false

RSpec/DescribeClass:
  Enabled: false

RSpec/MultipleDescribes:
  Enabled: false

RSpec/SpecFilePathFormat:
  Enabled: false
